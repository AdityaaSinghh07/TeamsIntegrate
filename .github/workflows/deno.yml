name: CI-CD Docker SSM Teams

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::585853585762:role/GithubActionOIDC
          aws-region: us-east-1

      - name: Build Docker Image
        run: |
          docker build -t cicd-app .

      - name: Deploy via SSM
        run: |
          aws ssm send-command \
            --instance-ids "i-0f438ea66d8368e21" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["cd /home/ubuntu && ./deploy.sh"]'

      - name: Teams Success Notification
        if: success()
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          cat > payload.json <<EOF
          {
            "@type": "MessageCard",
            "@context": "https://schema.org/extensions",
            "themeColor": "00FF00",
            "summary": "Deployment Successful",
            "sections": [
              {
                "activityTitle": "✅ Deployment Successful",
                "facts": [
                  {
                    "name": "Repository",
                    "value": "${{ github.repository }}"
                  },
                  {
                    "name": "Branch",
                    "value": "${{ github.ref_name }}"
                  },
                  {
                    "name": "Triggered By",
                    "value": "${{ github.actor }}"
                  }
                ]
              }
            ]
          }
          EOF

          curl -v \
            -H "Content-Type: application/json" \
            -d @payload.json \
            "$TEAMS_WEBHOOK_URL"

      - name: Teams Failure Notification
        if: failure()
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          cat > payload.json <<EOF
          {
            "@type": "MessageCard",
            "@context": "https://schema.org/extensions",
            "themeColor": "FF0000",
            "summary": "Deployment Failed",
            "sections": [
              {
                "activityTitle": "❌ Deployment Failed",
                "facts": [
                  {
                    "name": "Repository",
                    "value": "${{ github.repository }}"
                  },
                  {
                    "name": "Branch",
                    "value": "${{ github.ref_name }}"
                  },
                  {
                    "name": "Triggered By",
                    "value": "${{ github.actor }}"
                  }
                ]
              }
            ]
          }
          EOF

          curl -v \
            -H "Content-Type: application/json" \
            -d @payload.json \
            "$TEAMS_WEBHOOK_URL"
