name: Reusable Teams Notification Workflow

on:
  workflow_call:
    inputs:
      payload:
        required: true
        type: string

    secrets:
      TEAMS_WEBHOOK_URL:
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send Teams Notification
        run: |
          echo '${{ inputs.payload }}' > payload.json

          echo "Sending payload:"
          cat payload.json

          HTTP_CODE=$(curl -s -o response.txt \
            -w "%{http_code}" \
            -X POST \
            "${{ secrets.TEAMS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d @payload.json)

          echo "HTTP CODE: $HTTP_CODE"
          cat response.txt

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Teams notification failed"
            exit 1
          fi
